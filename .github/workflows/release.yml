name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: meta
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync Cargo.toml version
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          sed -i -E "0.1,/^version =/s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace

      - name: Commit & Push version bump
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to ${{ steps.meta.outputs.tag }}"
            git push origin HEAD:master
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rustmius-x86_64
            bin_name: rustmius
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rustmius-windows-x86_64.exe
            bin_name: rustmius.exe
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rustmius-macos-aarch64
            bin_name: rustmius
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: rustmius-macos-x86_64
            bin_name: rustmius

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" != "Windows" ]; then strip "${{ matrix.bin_name }}" || true; fi
          mv "${{ matrix.bin_name }}" "${{ matrix.artifact_name }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  deb:
    name: Build .deb (Debian/Ubuntu)
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            imagemagick \
            libxkbcommon0 \
            libwayland-client0 \
            libgl1 \
            libx11-6 \
            libxcursor1 \
            libxrandr2 \
            libxi6

      - name: Download generic binary
        uses: actions/download-artifact@v4
        with:
          name: binary-linux-x86_64
          path: prebuilt

      - name: Stage binary
        run: install -Dm755 prebuilt/rustmius-x86_64 target/release/rustmius

      - name: Build .deb package
        env:
          SKIP_BUILD: "1"
        run: ./packages/deb/build-deb.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  release:
    name: Publish GitHub Release
    needs: [prepare, build, deb]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum rustmius-* *.deb > SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          generate_release_notes: true
          files: |
            artifacts/rustmius-*
            artifacts/*.deb
            artifacts/SHA256SUMS.txt

  aur:
    name: Update AUR (${{ matrix.package }})
    needs: [prepare, build, release]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        package: [rustmius, rustmius-bin]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Download binary (rustmius-bin)
        if: matrix.package == 'rustmius-bin'
        uses: actions/download-artifact@v4
        with:
          name: binary-linux-x86_64
          path: .

      - name: Update PKGBUILD (rustmius-bin)
        if: matrix.package == 'rustmius-bin'
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          H_DESKTOP=$(sha256sum packages/org.rustmius.Rustmius.desktop | cut -d' ' -f1)
          H_PNG=$(sha256sum packages/rustmius.png | cut -d' ' -f1)
          H_LICENSE=$(sha256sum LICENSE | cut -d' ' -f1)
          H_BIN=$(sha256sum rustmius-x86_64 | cut -d' ' -f1)

          TARGET="packages/rustmius-bin/PKGBUILD"
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" "$TARGET"
          sed -i "s/^pkgrel=.*/pkgrel=1/" "$TARGET"
          python3 -c '
          import re, sys
          path, sums = sys.argv[1], sys.argv[2:]
          text = open(path).read()
          new_sums = "sha256sums=(\n    '\''" + "'\''\n    '\''".join(sums) + "'\''\n)"
          text = re.sub(r"sha256sums=\([^)]*\)", new_sums, text, flags=re.S)
          open(path, "w").write(text)
          ' "$TARGET" "$H_DESKTOP" "$H_PNG" "$H_LICENSE" "$H_BIN"

      - name: Update PKGBUILD (rustmius)
        if: matrix.package == 'rustmius'
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          curl -fsSL -o source.tar.gz "https://github.com/Cleboost/Rustmius/archive/${{ needs.prepare.outputs.tag }}.tar.gz"
          H_SRC=$(sha256sum source.tar.gz | cut -d' ' -f1)

          TARGET="packages/rustmius/PKGBUILD"
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" "$TARGET"
          sed -i "s/^pkgrel=.*/pkgrel=1/" "$TARGET"
          sed -i "s/^sha256sums=.*/sha256sums=('$H_SRC')/" "$TARGET"

      - name: Commit & Push PKGBUILD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/
          if ! git diff --cached --quiet; then
            git commit -m "chore(aur): update ${{ matrix.package }} to ${{ needs.prepare.outputs.tag }}"
            git pull --rebase origin master
            git push origin HEAD:master
          fi

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: ${{ matrix.package }}
          pkgbuild: ./packages/${{ matrix.package }}/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ needs.prepare.outputs.tag }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
