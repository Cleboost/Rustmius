name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rustmius-x86_64
            bin_name: rustmius
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rustmius-windows-x86_64.exe
            bin_name: rustmius.exe
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rustmius-macos-aarch64
            bin_name: rustmius
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: rustmius-macos-x86_64
            bin_name: rustmius

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" != "Windows" ]; then strip "${{ matrix.bin_name }}" || true; fi
          mv "${{ matrix.bin_name }}" "${{ matrix.artifact_name }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  deb:
    name: Build .deb (Debian/Ubuntu)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            imagemagick \
            libxkbcommon0 \
            libwayland-client0 \
            libgl1 \
            libx11-6 \
            libxcursor1 \
            libxrandr2 \
            libxi6

      - name: Download generic binary
        uses: actions/download-artifact@v4
        with:
          name: binary-linux-x86_64
          path: prebuilt

      - name: Stage binary
        run: install -Dm755 prebuilt/rustmius-x86_64 target/release/rustmius

      - name: Build .deb package
        env:
          SKIP_BUILD: "1"
        run: ./packages/deb/build-deb.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  release:
    name: Publish GitHub Release
    needs: [build, deb]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum rustmius-* *.deb > SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/rustmius-*
            artifacts/*.deb
            artifacts/SHA256SUMS.txt
