[package]
name = "rustmius"
version = "3.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Fast, native, open-source SSH client and host manager built in Rust"
repository = "https://github.com/Cleboost/Rustmius"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "wgpu", "wayland", "x11"] }
egui = "0.36"
alacritty_terminal = "0.26"
russh = "0.65"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
directories = "6.0"
aes-gcm = "0.11"
argon2 = "0.6"
rand = "0.10"
zeroize = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "default-tls"] }
base64 = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
